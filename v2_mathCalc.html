<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCalc</title>
    <link rel="stylesheet" href="v2_mathCalc.css">
</head>
<body>
    <div class="mathContainer">
        <div class="calcDiv1">
            <div class="smartCalc">
                <h1>Math Calculator</h1>
                <div class="calcScreen">0</div>
            </div>
        </div>
        <div class="calcBtnDiv">
            <button class="mathbutton functionBtns" id="onOffBtn">On/Off</button>
            <button class="mathbutton functionBtns" id="eraseBtn">←</button>
            <button class="mathbutton functionBtns" id="moduloBtn">Mod</button>
            <button class="mathbutton functionBtns" id="addBtn">+</button>
            <button class="mathbutton numBtn">7</button>
            <button class="mathbutton numBtn">8</button>
            <button class="mathbutton numBtn">9</button>
            <button class="mathbutton functionBtns" id="minusBtn">—</button>
            <button class="mathbutton numBtn">4</button>
            <button class="mathbutton numBtn">5</button>
            <button class="mathbutton numBtn">6</button>
            <button class="mathbutton functionBtns" id="timesBtn">⨉</button>
            <button class="mathbutton numBtn">1</button>
            <button class="mathbutton numBtn">2</button>
            <button class="mathbutton numBtn">3</button>
            <button class="mathbutton functionBtns"  id="divideBtn">÷</button>
            <button class="mathbutton functionBtns"  id="bracketsBtn">(    )</button>
            <button class="mathbutton numBtn">0</button>
            <button class="mathbutton numBtn">·</button>
            <button class="mathbutton functionBtns" id="calcBtn">=</button>
            
        </div>
    </div>
    
    <script src="v2_mathCalc.js"></script>
</body>
</html>
